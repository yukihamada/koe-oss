name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate workflow YAML
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import sys, yaml
          ok = True
          for p in __import__("glob").glob(".github/workflows/*.yml"):
              try:
                  yaml.safe_load(open(p))
                  print("ok", p)
              except Exception as e:
                  ok = False
                  print("FAIL", p, e)
          sys.exit(0 if ok else 1)
          PY

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  interop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Contract tests
        run: pytest tests/test_interop.py tests/test_pairing.py -q
      - name: iOS sync drift (skipped without upstream checkout)
        run: python tools/sync_ios.py check

  cli-audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: "CLI audit (no GPU on runners: skip synthesis)"
        run: python tools/audit_cli.py --no-synth
      - name: Sign script syntax
        run: sh -n scripts/sign.sh
