name: Koe
options:
  bundleIdPrefix: tokyo.hamada
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: "5BV85JW8US"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2026082715"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Koe:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
    # 🔴一時的にWidget埋め込みを外している(App Group未登録でプロビジョニングが通らないため)。
    # Xcodeサインイン→App Group登録が済んだら埋め戻す: dependencies: [{target: KoeWidgets, embed: true}]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.hamada.koe
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Koe.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  KoeWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.hamada.koe.widgets
        PRODUCT_NAME: KoeWidgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/KoeWidgets.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
  KoeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Koe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.hamada.koe.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Koe.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Koe"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Koe:
    build:
      targets:
        Koe: all
        KoeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [KoeTests]
    archive:
      config: Release
